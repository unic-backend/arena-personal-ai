<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Usman - Hors ligne</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0b;color:#e4e4e7;font-family:Inter,system-ui,sans-serif}.box{max-width:430px;text-align:center}.mark{position:relative;width:74px;height:74px;margin:0 auto 28px;border:3px solid #e07856;border-radius:50%}.mark:before{content:"";position:absolute;width:22px;height:22px;inset:0;margin:auto;border-radius:50%;background:#e07856}.mark:after{content:"";position:absolute;width:9px;height:9px;right:-6px;top:30px;border-radius:50%;background:#e07856}h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:0 0 10px}p{font-size:14px;line-height:1.65;color:#a1a1aa;margin:0 0 24px}button{border:1px solid rgba(224,120,86,.35);border-radius:10px;background:rgba(224,120,86,.12);color:#f2a489;padding:10px 18px;font-weight:600;cursor:pointer}button:hover{background:rgba(224,120,86,.2)}
    </style>
  </head>
  <body>
    <main class="box">
      <div class="mark" aria-hidden="true"></div>
      <h1>Usman est hors ligne</h1>
      <p>Le shell local reste disponible lorsqu'il a déjà été chargé. Vérifiez votre connexion pour retrouver le modèle distant et les connecteurs.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
