# Permissions par compte, service, action et niveau de risque.
#
# Ce fichier est modifiable par le proprietaire : c'est la specification qui le
# demande (« The user must be able to change these policies »). Le code ne
# contient aucune de ces decisions.
#
# Trois decisions possibles :
#   ALLOWED       l'action part sans rien demander
#   CONFIRMATION  tout est prepare, l'action attend un « oui »
#   DENIED        l'action ne part pas, meme demandee
#
# Trois niveaux de risque, repris de la specification : LOW, MEDIUM, HIGH.
# Le risque ne decide rien par lui-meme — il est affiche au moment de demander
# la confirmation, pour que le proprietaire voie ce qu'il autorise.
#
# REGLE QUI NE SE CONFIGURE PAS : une action absente de ce fichier est REFUSEE.
# Une capacite nouvelle n'est donc jamais autorisee par oubli.
#
# `interrupteur` relie une action a l'un des neuf booleens historiques de
# config/permissions.yaml. Ce booleen est un COUPE-CIRCUIT GENERAL : quand il
# est a false, l'action est refusee quoi que dise ce fichier. C'est ce qui
# empeche une modification ici de rallumer ce que le proprietaire a eteint
# globalement. Le plus strict des deux gagne, toujours.

defaut: DENIED

services:

  email:
    read:        {decision: ALLOWED,      risque: LOW}
    search:      {decision: ALLOWED,      risque: LOW}
    classify:    {decision: ALLOWED,      risque: LOW}
    summarize:   {decision: ALLOWED,      risque: LOW}
    label:       {decision: ALLOWED,      risque: LOW}
    archive:     {decision: ALLOWED,      risque: LOW}
    draft:       {decision: ALLOWED,      risque: LOW}
    move:        {decision: CONFIRMATION, risque: MEDIUM}
    unsubscribe: {decision: CONFIRMATION, risque: MEDIUM}
    mark_read:   {decision: ALLOWED,      risque: LOW}
    send:        {decision: CONFIRMATION, risque: HIGH, interrupteur: SEND_MESSAGES}
    # Suppression definitive. La specification la place en CONFIRMATION ;
    # la mettre a DENIED ici la rend simplement impossible.
    delete:      {decision: CONFIRMATION, risque: HIGH, interrupteur: DELETE}
    settings:    {decision: DENIED,       risque: HIGH}

  calendar:
    read:        {decision: ALLOWED,      risque: LOW}
    free_slots:  {decision: ALLOWED,      risque: LOW}
    draft:       {decision: ALLOWED,      risque: LOW}
    create:      {decision: CONFIRMATION, risque: MEDIUM}
    modify:      {decision: CONFIRMATION, risque: MEDIUM}
    delete:      {decision: CONFIRMATION, risque: HIGH, interrupteur: DELETE}

  website:
    inspect:     {decision: ALLOWED,      risque: LOW}
    analyze:     {decision: ALLOWED,      risque: LOW}
    draft:       {decision: ALLOWED,      risque: LOW}
    publish:     {decision: CONFIRMATION, risque: HIGH, interrupteur: PUBLISH}
    delete:      {decision: CONFIRMATION, risque: HIGH, interrupteur: DELETE}

  social:
    read:        {decision: ALLOWED,      risque: LOW}
    draft:       {decision: ALLOWED,      risque: LOW}
    schedule:    {decision: CONFIRMATION, risque: MEDIUM, interrupteur: PUBLISH}
    publish:     {decision: CONFIRMATION, risque: HIGH,   interrupteur: PUBLISH}
    reply:       {decision: CONFIRMATION, risque: HIGH,   interrupteur: SEND_MESSAGES}

  search_console:
    read:        {decision: ALLOWED,      risque: LOW}
    analyze:     {decision: ALLOWED,      risque: LOW}
    submit:      {decision: CONFIRMATION, risque: MEDIUM}

  business_profile:
    read:        {decision: ALLOWED,      risque: LOW}
    draft:       {decision: ALLOWED,      risque: LOW}
    update:      {decision: CONFIRMATION, risque: HIGH, interrupteur: PUBLISH}
    reply:       {decision: CONFIRMATION, risque: HIGH, interrupteur: SEND_MESSAGES}

  # Donnees publiques du Senegal (GalsenAPI). Lecture seule, sans identifiant :
  # le connecteur ne declare aucune capacite d'ecriture, donc il n'y a rien
  # d'autre a autoriser ici. Ajouter une action d'ecriture dans ce fichier ne la
  # ferait pas exister — une capacite non declaree n'atteint jamais le service.
  senegal_data:
    read:        {decision: ALLOWED,      risque: LOW}
    search:      {decision: ALLOWED,      risque: LOW}

  # Generation video locale (WanGP / Wan2GP). Elle ne sort pas de la machine,
  # mais elle monopolise la carte graphique plusieurs minutes et ecrit un
  # fichier : elle passe par une confirmation, et par le coupe-circuit
  # WRITE_FILES. Lire les modeles ou la galerie ne coute rien.
  #
  # Pourquoi elle n'est PAS dans INTERRUPTEURS_OBLIGATOIRES : ce plancher du
  # code est reserve aux trois actions irreversibles — envoyer, publier,
  # supprimer. Une video generee s'efface. Un test le dit
  # (test_les_trois_interrupteurs_bloquants_couvrent_les_actions_irreversibles),
  # il a refuse l'ajout, et il avait raison.
  #
  # `cancel` est ALLOWED alors que la capacite est declaree `ecriture=True` :
  # c'est voulu. Annuler REDUIT un effet, elle n'en emet aucun, et demander une
  # confirmation pour arreter une generation qui s'emballe sur la carte
  # graphique serait nuisible au moment exact ou il faut aller vite. Ecrit ici
  # parce qu'un audit automatique signale cette ligne comme une « ecriture sans
  # confirmation » (mesure du 01/09/2026) et qu'un futur lecteur la corrigerait
  # a tort.
  video_generation:
    read:        {decision: ALLOWED,      risque: LOW}
    generate:    {decision: CONFIRMATION, risque: MEDIUM, interrupteur: WRITE_FILES}
    cancel:      {decision: ALLOWED,      risque: LOW}

  # Analyse de visages (SDK Faceplugin, moteur local hors depot).
  #
  # **Deux niveaux, et la frontiere est l'identite.** Compter des visages et
  # placer des reperes ne dit pas QUI : ce sont des lectures, comme mesurer une
  # image. Extraire un gabarit et comparer deux visages produisent de la
  # BIOMETRIE — une donnee qui identifie une personne. Ces deux-la demandent
  # l'accord du proprietaire, a chaque fois.
  #
  # `interrupteur: WRITE_FILES` parce qu'un gabarit extrait est une donnee
  # personnelle qui sort du moteur : le coupe-circuit general doit pouvoir
  # l'arreter. Pas dans INTERRUPTEURS_OBLIGATOIRES : rien ne quitte la machine,
  # et le plancher du code reste reserve a envoyer, publier, supprimer.
  #
  # Le connecteur n'a AUCUNE base de visages et n'en constitue pas : comparer
  # exige les deux images dans le meme appel. Il n'y a donc rien a interroger
  # en arriere-plan, et aucune identification implicite n'est possible.
  biometrie_visage:
    read:        {decision: ALLOWED,      risque: LOW}
    biometrie:   {decision: CONFIRMATION, risque: HIGH, interrupteur: WRITE_FILES}

  # Intelligence de design (UI/UX Pro Max, MIT, moteur local hors depot).
  #
  # Lecture pure : le moteur interroge des tables CSV et rend des
  # recommandations. Rien n'est ecrit, rien ne part. L'option `--persist` du
  # moteur n'est deliberement pas exposee — une capacite de raisonnement qui
  # demanderait des droits d'ecriture « au cas ou » les elargirait sans usage.
  design_ui:
    read:        {decision: ALLOWED,      risque: LOW}

  # Devis UniC Plaquiste. Chiffrer ne coute rien et n'ecrit rien.
  #
  # Produire le PDF est passe de CONFIRMATION a ALLOWED le 04/09/2026, sur
  # demande explicite du proprietaire : « si tu demandes un pdf il le fait
  # simplement [...] je veux ca a tout prix ». La distinction qui rend ce
  # choix tenable, et qui ne s'applique qu'ici :
  #
  #   ecrire un PDF chez lui n'est PAS un effet qui quitte la machine.
  #
  # Le fichier atterrit dans `media/rendered/`, il le relit, et c'est LUI qui
  # decide ensuite de l'envoyer. Rien ne part chez un client, rien ne coute,
  # rien n'est irreversible — un fichier s'efface. La confirmation ne le
  # protegeait donc de rien ici : elle ajoutait une etape entre « fais-moi le
  # devis » et le devis.
  #
  # Ce qui garde sa confirmation, et pourquoi : envoyer un e-mail (part chez
  # un client), publier sur ses reseaux (public), generer une video
  # (des minutes de GPU), parler (VoiceStudio ecrit puis peut etre diffuse).
  # La regle n'est pas « les ecritures sont libres » : elle est « ce qui
  # reste sur sa machine et qu'il relit avant d'agir ne demande pas d'accord
  # prealable ».
  #
  # `interrupteur: WRITE_FILES` reste : couper cet interrupteur coupe encore
  # la production du PDF, comme toute ecriture de fichier.
  plaquiste:
    read:        {decision: ALLOWED, risque: LOW}
    document:    {decision: ALLOWED, risque: MEDIUM, interrupteur: WRITE_FILES}

  # Montage video. Batir une timeline et la relire ne touche a rien : c'est
  # une structure en memoire, pas un fichier. Rendre ecrit une video sur le
  # disque et monopolise le processeur — meme logique que le devis PDF et
  # l'export OpenTakeoff : confirmation, coupe-circuit WRITE_FILES.
  #
  # Pas dans INTERRUPTEURS_OBLIGATOIRES pour la meme raison que la generation
  # video : un fichier rendu s'efface, ce n'est pas irreversible. Le plancher
  # du code reste reserve a envoyer, publier, supprimer.
  video_montage:
    read:        {decision: ALLOWED,      risque: LOW}
    document:    {decision: CONFIRMATION, risque: MEDIUM, interrupteur: WRITE_FILES}

  # Xaar Kaname / Deep-Live-Cam : transformation locale d'une image/video.
  # Le moteur ecrit un nouvel artefact sur disque et utilise le GPU :
  # confirmation obligatoire + coupe-circuit WRITE_FILES.
  # Audio et voix (VoiceStudio, pilote par HTTP en local). Ecouter un fichier
  # deja sur la machine ne cree rien ; produire de la parole ecrit un fichier
  # WAV, donc confirmation et coupe-circuit WRITE_FILES, comme le devis PDF.
  # Une voix est une donnee sensible : le connecteur refuse deja toute adresse
  # non locale (`core/connectors/audio_voix.py`).
  audio_voix:
    read:        {decision: ALLOWED,      risque: LOW}
    document:    {decision: CONFIRMATION, risque: MEDIUM, interrupteur: WRITE_FILES}

  # OpenTakeoff : mesurer un plan PDF ne touche a rien hors du processus qui
  # le lit. Exporter ecrit le rapport et le plan marque a cote du plan source
  # — meme logique que le devis PDF : confirmation, coupe-circuit WRITE_FILES.
  takeoff:
    read:        {decision: ALLOWED,      risque: LOW}
    export:      {decision: CONFIRMATION, risque: MEDIUM, interrupteur: WRITE_FILES}

  # Graphify : le graphe structurel du depot (DEC-0046). Interroger un graphe
  # deja construit ne touche a rien — meme lecture que `takeoff.read`.
  # Construire ecrit graphify-out/ (graph.json, graph.html, GRAPH_REPORT.md) :
  # coupe-circuit WRITE_FILES, comme toute ecriture de ce depot.
  graphify:
    read:        {decision: ALLOWED,      risque: LOW}
    document:    {decision: ALLOWED,      risque: LOW, interrupteur: WRITE_FILES}

  # GitIngest : un depot (local ou une URL) transforme en resume+arbre+contenu
  # (DEC-0047). Aucune ecriture durable (le clone temporaire d'une URL est
  # nettoye par GitIngest lui-meme) : une lecture, comme la recherche web deja
  # libre dans ce depot. Risque MEDIUM, pas LOW : une URL clone un contenu
  # tiers, potentiellement hostile, meme brievement.
  gitingest:
    read:        {decision: ALLOWED,      risque: MEDIUM}

  # Guide de procedure : un workflow deja decrit (jamais capture en direct),
  # ecrit en PDF/DOCX/HTML/Markdown (DEC-0048). Meme logique que le devis
  # (DEC-0041) : le fichier reste local, il est relu avant d'etre partage —
  # coupe-circuit WRITE_FILES, pas de confirmation prealable.
  workflow_guide:
    document:    {decision: ALLOWED,      risque: LOW, interrupteur: WRITE_FILES}

# Regles par compte — ce sont les POLITIQUES D'AUTOMATISATION.
#
# La specification demande de pouvoir pre-autoriser des flux de travail
# recurrents et fiables. C'est ce que fait une regle de compte : mettre
# `email.send: ALLOWED` sur un compte precis, c'est declarer qu'ARENA envoie
# depuis celui-la sans demander. Tout ce qui n'est pas ecrit ici continue de
# passer par la confirmation.
#
# Aucun second mecanisme n'a ete invente pour cela : celui-ci fait deja
# exactement ce qui est demande, et deux endroits pour dire la meme chose sont
# un endroit pour se contredire.
#
# Elles l'emportent sur les regles du service, dans les deux sens : un compte
# peut etre plus ouvert ou plus ferme que son service. Ce qu'elles ne peuvent
# PAS faire : passer outre un coupe-circuit general eteint.
#
# Le proprietaire ecrit ici, par exemple :
#
# comptes:
#   "unicplaquiste@gmail.com":
#     email:
#       send: ALLOWED        # envois automatiques autorises sur ce compte
#   "perso@gmail.com":
#     email:
#       read: DENIED         # ARENA ne lit pas ce compte du tout
comptes: {}
