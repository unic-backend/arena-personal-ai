# =============================================================================
# UniC Plaquiste — connaissances metier
# =============================================================================
# Tout ce que l'assistant sait du metier vient d'ici, jamais du code. Les prix
# changent ; un prix ecrit dans un fichier Python devient faux sans que rien ne
# le signale.
#
# Source : les devis et factures Fast Group du 14/07/2026 et du 04/08/2026,
# fournis par le proprietaire le 27/08/2026, et son fichier de reference
# `UniC_Plaquiste_Template_Reference1.py`.
#
# REGLE : un article absent de cette grille n'a pas de prix. L'assistant le dit
# et demande, il n'en invente jamais un.
# =============================================================================

entreprise:
  nom: "UniC Plaquiste"
  accroche: "Renovation & Decoration"
  specialite: "Specialiste faux plafonds BA13, cloisons seches & decoration"
  gerant: "Uthman"
  telephone: "+221 77 708 50 92"
  adresse: "Dakar, Senegal — Disponible aussi a l'international"
  site: "www.unicplaquiste.com"
  email: "unicplaquiste@gmail.com"
  ninea: "013141677"
  rccm: "SN.DKR.2026.A.22010"
  devise: "FCFA"

# Couleurs de la charte, reprises du fichier de reference du proprietaire.
charte:
  bleu: "#1A3FA0"
  jaune: "#F2C200"
  gris: "#666666"
  vert: "#1B7A3D"

# Conventions observees dans ses documents, pas inventees.
conventions:
  numerotation: "UC-AAAA-MMJJ-CLI"      # ex. UC-2026-0714-FGM
  suffixes:
    materiaux: "FG"                      # devis fournitures
    portes: "FGP"                        # devis portes sur mesure
    main_oeuvre: "FGM"                   # facture main-d'oeuvre
  validite_devis_jours: [15, 30]
  regle_surface: >-
    Une cloison fermee sur ses deux faces se facture en surface developpee :
    la pose, les joints, l'enduit, le poncage et la peinture sont realises
    deux fois. Surface facturee = surface de mur x 2.
  mention_prix_unitaire: >-
    Les prix indiques dans la colonne « Prix Unitaire » sont des prix a
    l'unite, et non des montants totaux.

# Prix unitaires en FCFA. Source : devis Fast Group.
prix_materiaux:
  "Plaque standard BA13": 4500
  "Plaque hydrofuge": 7000
  "Rails 48 mm": 1500
  "Montant 48 mm": 1600
  "Rails 7 cm (70 mm)": 2600
  "Montant 7 cm (70 mm)": 2700
  "Cornieres": 700
  "Paquet de fourrures": 1200
  "Paquet chevilles a frapper": 5000
  "Chevilles a Leton": 6000
  "Pivot": 6500
  "Paquet vis (25 mm ou 35 mm)": 5000
  "Vis 9 mm": 5000
  "Tiges (a l'unite)": 300
  "Sac enduit": 12000
  "Bande a joints": 3000
  "Bande armee": 6500
  "Toile": 500
  "Papier poncage": 6000
  "Scotch isolant": 1000
  "Peinture en eau Gylatex (coloris)": 11500
  "Enduit coloris": 10000
  "Laine de verre (paquet)": 30000
  # Ajoutes le 2026-08-27 depuis le devis 18 parois UC-2026-0804-FG2.
  "Seau enduit": 11000
  "Seau Katex": 25000
  "Paquet papier enduit": 10000
  "Ciment platre (5 kg)": 250
  "Bache / Basse (5 m)": 1500

# Portes fabriquees sur mesure. Source : devis UC-2026-0714-FGP.
prix_portes:
  "Feuille de contreplaque (CTP) 9 mm": 17500
  "Planche en bois (4m50 x 35 cm)": 22050
  "Quincaillerie (serrure + paumelle + verrou)": 14000

main_oeuvre:
  tarif_m2: 5000
  libelle: >-
    Forfait pose complete : ossature, isolation, pose BA13, joints, enduits,
    poncage et peinture.

# Ce qui n'est jamais compris, sauf mention contraire explicite du proprietaire.
# Metiers qui ne sont pas les siens. Ils ne sont jamais chiffres : l assistant
# le dit et renvoie vers un corps de metier. Source : bon de commande
# UC-2026-0820-FG, « Exclusions : travaux d electricite, de plomberie et de
# climatisation ».
metiers_hors_perimetre:
  - "electricite"
  - "electrique"
  - "luminaire"
  - "bandeau led"
  - "plomberie"
  - "plombier"
  - "climatisation"
  - "climatiseur"

exclusions_habituelles:
  - "Travaux d'electricite, de plomberie et de climatisation."
  - "Luminaires et bandeaux LED."
  - "Tout accessoire ou finition non liste dans les tableaux."

# Formulations qui reviennent dans ses documents. Ton de la maison.
engagements:
  qualite: >-
    UniC Plaquiste s'engage a realiser un travail propre, precis et soigne du
    debut a la fin du chantier, dans le respect des regles de l'art et des
    delais, pour garantir une finition premium et un rendu impeccable.
  geste_commercial: >-
    Une remise commerciale marque le debut d'une collaboration : elle se
    justifie par la volonte de gagner la confiance du client et de poser les
    bases d'un partenariat durable, jamais par une baisse de la qualite.
  remerciement: "UniC Plaquiste vous remercie de votre confiance."
