# =============================================================================
# UniC Plaquiste — connaissances metier
# =============================================================================
# Tout ce que l'assistant sait du metier vient d'ici, jamais du code. Les prix
# changent ; un prix ecrit dans un fichier Python devient faux sans que rien ne
# le signale.
#
# Source : les devis et factures Fast Group du 14/07/2026 et du 04/08/2026,
# fournis par le proprietaire le 27/08/2026, et son fichier de reference
# `UniC_Plaquiste_Template_Reference1.py`.
#
# REGLE : un article absent de cette grille n'a pas de prix. L'assistant le dit
# et demande, il n'en invente jamais un.
# =============================================================================

entreprise:
  nom: "UniC Plaquiste"
  accroche: "Renovation & Decoration"
  specialite: "Specialiste faux plafonds BA13, cloisons seches & decoration"
  gerant: "Uthman"
  telephone: "+221 77 708 50 92"
  adresse: "Dakar, Senegal — Disponible aussi a l'international"
  site: "www.unicplaquiste.com"
  # Deux applications, confirmees toutes les deux par le proprietaire
  # (02/09/2026) : "app" cote client, "expert" cote pro. Une liste, pas un
  # champ unique, pour ne pas devoir choisir laquelle est "la" bonne.
  applications:
    - "app.unicplaquiste.com"
    - "expert.unicplaquiste.com"
  # Presence en ligne fournie par le proprietaire le 02/09/2026. Liens
  # canoniques : les jetons de partage (?_t=, ?igsi=, ?g_st=...) sont retires,
  # ils suivent la maniere dont le lien a ete partage, pas l'adresse elle-meme.
  fiche_google_maps: "https://maps.app.goo.gl/fKvNLhN1r3U88gsv9"
  reseaux_sociaux:
    tiktok: "https://www.tiktok.com/@unic_plaquiste"
    instagram: "https://www.instagram.com/unic_plaquiste"
  email: "unicplaquiste@gmail.com"
  ninea: "013141677"
  rccm: "SN.DKR.2026.A.22010"
  devise: "FCFA"

# Couleurs de la charte, reprises du fichier de reference du proprietaire.
charte:
  bleu: "#1A3FA0"
  jaune: "#F2C200"
  gris: "#666666"
  vert: "#1B7A3D"

# Conventions observees dans ses documents, pas inventees.
conventions:
  numerotation: "UC-AAAA-MMJJ-CLI"      # ex. UC-2026-0714-FGM
  suffixes:
    materiaux: "FG"                      # devis fournitures
    portes: "FGP"                        # devis portes sur mesure
    main_oeuvre: "FGM"                   # facture main-d'oeuvre
  validite_devis_jours: [15, 30]
  regle_surface: >-
    Une cloison fermee sur ses deux faces se facture en surface developpee :
    la pose, les joints, l'enduit, le poncage et la peinture sont realises
    deux fois. Surface facturee = surface de mur x 2.
  mention_prix_unitaire: >-
    Les prix indiques dans la colonne « Prix Unitaire » sont des prix a
    l'unite, et non des montants totaux.

