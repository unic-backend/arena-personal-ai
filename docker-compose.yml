version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: arena_mongodb
    restart: always
    volumes:
      - ./data/database/mongo:/data/db

  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: arena_librechat
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=http://localhost:3080
      - DOMAIN_SERVER=http://localhost:3080
      - NO_INDEX=true
      - CONFIG_PATH=/app/librechat.yaml
      - CREDS_KEY=f34fa221d603a11124e85d95e0c5fe9a21b34e56789abcdef123456789abcdef
      - JWT_SECRET=a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_REFRESH_SECRET=b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef
      - ALLOW_REGISTRATION=true
    volumes:
      - ./librechat.yaml:/app/librechat.yaml

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: arena_open_webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=arena-local-key
      - WEBUI_SECRET_KEY=arena_secret_key_12345
    volumes:
      - ./data/database/open-webui:/app/backend/data
    restart: always