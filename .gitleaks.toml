# Configuration gitleaks pour Usman.
#
# Les regles par defaut de gitleaks ne suffisent pas ici : la cle qui a declenche
# l'audit du 26/08/2026, `apiKey: "arena-****-****"` dans librechat.yaml, a trop
# peu d'entropie pour la regle generique. Elle est passee inapercue.
# Les deux regles ci-dessous visent les emplacements exacts ou ce projet ecrit
# des secrets.

title = "Usman — detection de secrets"

# On garde toutes les regles standard, et on ajoute les notres.
[extend]
useDefault = true

[[rules]]
id = "usman-librechat-apikey"
description = "Cle API ecrite en clair dans un fichier YAML (librechat.yaml)"
regex = '''(?i)apikey\s*:\s*["']([^"'\s]{8,})["']'''
secretGroup = 1
tags = ["usman", "apikey"]
path = '''\.ya?ml$'''

  [rules.allowlist]
  # Une reference a une variable d'environnement n'est pas un secret.
  regexTarget = "match"
  regexes = ['''\$\{[A-Z_][A-Z0-9_]*\}''']

[[rules]]
id = "usman-compose-secret"
description = "Secret ecrit en clair au lieu d'une variable d'environnement"
# Le jeu de caracteres est volontairement etroit : un vrai secret est fait de
# lettres, chiffres, tirets et soulignes. `os.getenv("...` ou `<a remplacer>`
# n'en sont pas, et n'ont pas a declencher une alerte.
regex = '''(?i)\b(CREDS_KEY|JWT_SECRET|JWT_REFRESH_SECRET|WEBUI_SECRET_KEY|USMAN_API_KEY|ARENA_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|SECRET_KEY)\s*[=:]\s*["']?([A-Za-z0-9_-]{9,})["']?'''
secretGroup = 2
tags = ["usman", "secret"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''\$\{[A-Z_][A-Z0-9_]*\}''',
    # Valeurs de remplacement documentaires, jamais de vrais secrets.
    '''change_this_to_a_secure_random_key''',
    '''(?i)(exemple|example|placeholder|votre[_-]?cle|<[^>]+>)''',
    # --- Faux positifs mesures le 01/09/2026, quand le budget CI est revenu
    # et que le scan a pu tourner pour de vrai (4 fuites, toutes fausses).
    #
    # Deux sont des affectations a une VARIABLE, pas a un litteral :
    # `security.USMAN_API_KEY = CLE_DE_TEST` et `= originale`, dans
    # scripts/auditer_surface_publique.py, qui pose puis restitue une cle
    # factice. `CLE_DE_TEST` vaut « audit-cle-de-test-non-secrete » et se
    # nomme elle-meme. Vise par NOM de variable, jamais par fichier : un
    # vrai secret ecrit dans ce meme script serait toujours detecte.
    '''=\s*(CLE_DE_TEST|originale)\s*$''',
    # La troisieme est une fixture de test : une chaine de 32 hex qui a la
    # FORME d'une cle, utilisee par tests/core/test_confidentialite.py pour
    # prouver que le classificateur la repere et ne la recopie pas dans son
    # motif. Verifie dans tout l'historique (`git log --all -S`) : elle
    # n'apparait que dans le commit qui l'a inventee (1098f3c), jamais dans
    # un .env ni une configuration. Visee par valeur exacte.
    '''4409dde42d4099b9296b5cca987b7c00''',
  ]

[allowlist]
description = "Emplacements ou une valeur de forme secrete est attendue"
# Valeur factice des tests qui verifient le masquage des secrets. Le motif vise
# la VALEUR, pas le fichier : un vrai secret depose dans ces memes tests serait
# toujours detecte. Mesure le 2026-08-28 en plantant une autre valeur.
regexTarget = "match"
regexes = ['''ya29\.SECRET-[A-Z-]+''']
# Les motifs ne sont PAS ancres par `^` : gitleaks compare le chemin tel qu'il
# lui est donne. Avec `--source .` il est relatif, avec `--source /chemin/absolu`
# il ne l'est pas, et un motif ancre cesse alors silencieusement de s'appliquer.
# Mesure le 26/08/2026 : 3 faux positifs apparaissaient dans ce cas.
paths = [
  # Artefacts locaux, jamais versionnes.
  '''__pycache__''',
  '''(^|/)\.(ruff|pytest)_cache/''',
  # Fichier d'exemple : il ne contient que des valeurs vides ou explicatives.
  '''(^|/)\.env\.example$''',
  # Les tests du preparateur de purge utilisent des valeurs inventees, et le
  # garde-fou documentaire doit connaitre la forme de ce qu'il cherche.
  '''(^|/)tests/test_preparer_purge_secrets\.py$''',
  '''(^|/)tests/test_documentation\.py$''',
  # Ce fichier decrit les regles : ses exemples ne sont pas des secrets.
  '''(^|/)\.gitleaks\.toml$''',
]
