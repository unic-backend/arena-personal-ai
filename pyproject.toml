[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests asynchrones n'ont pas besoin de decorateur : pytest-asyncio les prend
# en charge automatiquement.
asyncio_mode = "auto"
markers = [
    "integration: exige un service externe (Ollama, Docker, reseau, Chromium). Desactive par defaut.",
]
# Par defaut on n'execute que ce qui tourne hors ligne.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
# `apps/pwa` est une application a part : TypeScript compile par Vite, plus un
# serveur Python qui lui est propre (`apps/pwa/server/`, avec son propre
# requirements.txt). Le lint d'ARENA ne le regarde pas — non parce que le code y
# echapperait, mais parce que le reformater serait un remaniement non demande.
# **Cette exclusion est provisoire** : le jour ou ce serveur est absorbe dans
# ARENA, il entre sous `core/` et il est linté comme le reste ; le jour ou il est
# ecarte, l'exclusion part avec lui.
#
# `.claude/skills/` : contenu tiers copie verbatim (licence MIT, provenance
# dans `docs/audits/`). Le lint d'ARENA ne le corrige pas : c'est un skill de
# developpement, jamais execute par ARENA en service, et le reformater
# divergerait de la source qu'on pourrait vouloir resynchroniser plus tard.
exclude = ["media", "data", "apps/pwa", ".claude/skills"]

[tool.ruff.lint]
# Jeu volontairement resserre : erreurs reelles, imports inutiles, imports non
# tries, pieges courants. La longueur de ligne (E501) n'est pas selectionnee :
# la faire respecter reformaterait des prompts entiers, ce qui n'est pas du
# ressort d'un lint.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Ces fichiers inserent la racine du projet dans sys.path avant leurs imports :
# l'ordre est voulu, pas un oubli.
"apps/backend/main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tools/browser/browser_use_tool.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# `File(...)`, `Form(...)`, `Depends(...)` et `Header(...)` en valeur par defaut
# sont l'idiome FastAPI, pas l'erreur que B008 cherche a attraper.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Header",
]
