name: CI

on:
  push:
    branches: ["master", "claude/**"]
  pull_request:
    branches: ["master"]

jobs:
  lint-and-test:
    name: Lint and offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Meme version que apps/backend/Dockerfile.
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only what the offline suite imports, pinned by requirements.txt used as
        # a constraints file. Installing the full dependency tree (browser-use,
        # lightrag, faster-whisper) would take minutes and test nothing more:
        # every service-dependent test carries the `integration` marker and is
        # deselected here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -c requirements.txt fastapi httpx pyyaml python-dotenv pydantic \
            python-multipart pypdf python-docx openpyxl python-pptx pypdfium2 pytesseract reportlab \
            gitingest numpy txtai_minimal ifcopenshell psutil
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  dependencies:
    name: Declared dependencies still resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Resolve requirements.txt
        # Resolution only: this is what caught pywin32 pinned without a platform
        # marker, which made the Linux Docker build impossible.
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apps/backend/Dockerfile
        # Cette image existe depuis le tout premier commit du depot et
        # personne — aucun outil, aucun humain — ne l'avait jamais construite.
        # "dependencies" (ci-dessus) verifiait deja que requirements.txt se
        # resout, precisement parce que c'est ce qui avait un jour rendu
        # l'image irreconstructible (pywin32 sans marqueur de plateforme).
        # Une resolution qui reussit ne prouve pas qu'une image se construit :
        # cette etape construit l'image elle-meme, pour de vrai.
        run: docker build -f apps/backend/Dockerfile -t arena:ci .

      - name: Verify a root-owned bind mount is still writable by arena
        # Trouve pendant la phase 3.2 en testant la sauvegarde SQLite pour de
        # vrai : un volume monte depuis l'hote arrive root:root, et `USER
        # arena` fixe (phase 3.1) rendait /app/data illisible au demarrage —
        # PermissionError des la premiere ecriture. `entrypoint.sh` corrige
        # les permissions avant de passer la main via `gosu` ; cette etape le
        # verifie a chaque build, sans avoir a demarrer uvicorn.
        run: |
          mkdir -p /tmp/donnees-test
          docker run --rm -v /tmp/donnees-test:/app/data \
            --entrypoint apps/backend/entrypoint.sh arena:ci \
            sh -c "touch /app/data/preuve-ecriture && whoami"

      - name: Verify the container starts with no volume at all
        # Panne reelle du premier deploiement (Railway, chapitre 5) : `data/`
        # est exclu de l'image par `.dockerignore` (monte en volume, jamais
        # copie), et Railway ne monte aucun volume par defaut — /app/data
        # n'existe nulle part. `chown` sur un chemin absent tuait le
        # conteneur en boucle avant meme que /health reponde. L'etape
        # ci-dessus ne peut pas voir cette panne : elle monte toujours un
        # volume.
        run: |
          docker run --rm --entrypoint apps/backend/entrypoint.sh arena:ci \
            sh -c "ls -ld /app/data /app/media && whoami"

  pwa:
    name: PWA typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La version vient du fichier, pas d'un nombre recopie ici.
          # Mesure du 03/09/2026 : la CI epinglait « 20 » pendant que le
          # developpement tournait en 22. `undici@8` (tire par jsdom) appelle
          # `webidl.util.markAsUncloneable`, absente de Node 20 — les 12 tests
          # passaient en local et la CI rendait « no tests », ce qui se lit
          # comme une suite vide plutot que comme une panne. Un seul endroit
          # decide, donc les deux ne peuvent plus diverger en silence.
          node-version-file: apps/pwa/.nvmrc
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json

      - name: Install
        working-directory: apps/pwa
        # `npm ci` plutot que `npm install` : la CI installe ce que le
        # verrou dit, jamais une version resolue au moment ou elle tourne.
        run: npm ci

      - name: Typecheck
        working-directory: apps/pwa
        run: npx tsc --noEmit

      - name: Tests
        working-directory: apps/pwa
        # Ce depot a vecu sans lanceur de tests cote interface jusqu'au
        # 03/09/2026. Les regles de sûrete du chat — ne jamais laisser une
        # demo repondre a la place du serveur, ne pas debrancher sur une
        # coupure passagere — n'etaient gardees que par des tests Python qui
        # LISENT le source TypeScript. Une garde qui lit du texte voit une
        # forme, pas un comportement.
        run: npm test

      - name: Build
        working-directory: apps/pwa
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Toute l'histoire : l'etape 2 compare la branche a master.
          fetch-depth: 0

      - name: Install gitleaks
        # Le binaire est telecharge et epingle plutot que d'utiliser l'action du
        # marketplace, qui demande une licence pour les depots d'organisation.
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: No secret in the current files
        # Le controle principal : aucun secret dans les fichiers tels qu'ils sont.
        # C'est celui qui attrape une valeur recopiee dans un test ou un document.
        run: gitleaks detect --source . --no-git --no-banner --redact --config .gitleaks.toml

      - name: No secret added by this branch
        # Un secret ajoute puis retire dans un commit de la branche reste dans
        # l'historique : on compare donc la branche a master.
        # L'historique anterieur contient des secrets connus (voir P-01 du
        # worklog) ; il sera scannable en entier une fois T-01 executee.
        if: github.ref != 'refs/heads/master'
        run: |
          git fetch origin master --quiet
          if git rev-parse --verify --quiet origin/master >/dev/null; then
            gitleaks detect --source . --no-banner --redact --config .gitleaks.toml \
              --log-opts="origin/master..HEAD"
          else
            echo "Pas de branche master a comparer, etape ignoree."
          fi
