name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# This workflow only reads repository contents. Keep GITHUB_TOKEN explicitly
# read-only so adding a third-party action later cannot silently inherit write
# access from repository defaults.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Meme version que apps/backend/Dockerfile.
          python-version: "3.11"
          cache: pip

      - name: Install native tools required by the offline suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libreoffice ffmpeg tesseract-ocr tesseract-ocr-fra fonts-dejavu-core

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -c requirements.txt fastapi httpx pyyaml python-dotenv pydantic \
            python-multipart pypdf python-docx openpyxl python-pptx pypdfium2 pytesseract reportlab \
            gitingest numpy txtai_minimal ifcopenshell psutil cryptography mcp \
            weasyprint cairosvg markdown openai chromadb
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  dependencies:
    name: Declared dependencies still resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Resolve requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/backend/Dockerfile
        run: docker build -f apps/backend/Dockerfile -t arena:ci .
      - name: Verify a root-owned bind mount is still writable by arena
        run: |
          mkdir -p /tmp/donnees-test
          docker run --rm -v /tmp/donnees-test:/app/data \
            --entrypoint apps/backend/entrypoint.sh arena:ci \
            sh -c "touch /app/data/preuve-ecriture && whoami"
      - name: Verify document capabilities inside the final image
        run: |
          SMOKE_KEY="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          docker run --rm -e USMAN_API_KEY="$SMOKE_KEY" \
            --entrypoint apps/backend/entrypoint.sh arena:ci \
            python -m scripts.document_runtime_smoke
      - name: Verify the container starts with no volume at all
        run: |
          docker run --rm --entrypoint apps/backend/entrypoint.sh arena:ci \
            sh -c "ls -ld /app/data /app/media && whoami"

  pwa:
    name: PWA typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/pwa/.nvmrc
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Install
        working-directory: apps/pwa
        run: npm ci
      - name: Typecheck
        working-directory: apps/pwa
        run: npx tsc --noEmit
      - name: Tests
        working-directory: apps/pwa
        run: npm test
      - name: Build
        working-directory: apps/pwa
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: No secret in the current files
        run: gitleaks detect --source . --no-git --no-banner --redact --config .gitleaks.toml
      - name: No secret anywhere in the history
        run: gitleaks detect --source . --no-banner --redact --config .gitleaks.toml
      - name: No secret added by this branch
        run: |
          git fetch origin main --depth=1
          gitleaks git --log-opts="origin/main..HEAD" --no-banner --redact --config .gitleaks.toml
