name: Real connector validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  real-connectors:
    name: Real authentication and read-only connector probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REAL_INTEGRATION: "1"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      USMAN_GITHUB_TOKEN: ${{ secrets.USMAN_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install connector test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -c requirements.txt httpx pydantic pyyaml python-dotenv
      - name: Real connector probes (read-only)
        run: pytest tests/integration/ -q -ra -m integration
